# Preguntas Frecuentes (FAQ)

En esta sección encontrarás respuestas rápidas a las dudas más comunes sobre el uso de nuestra aplicación.

### ❓ 1. ¿Qué es Catálogo Pro?
Catálogo Pro es una plataforma digital que permite a los usuarios explorar un catálogo de productos tecnológicos, consultar sus precios, buscar artículos por categoría y agregarlos a un carrito de compras. Su objetivo es facilitar el acceso a productos tecnológicos de manera organizada y práctica.

### ❓ 2. ¿Qué tipos de productos puedo encontrar en Catálogo Pro?
En Catálogo Pro se pueden encontrar diferentes productos tecnológicos, como computadoras portátiles, teléfonos celulares, tabletas, audífonos, teclados, mouse, monitores, discos SSD y tarjetas gráficas. Los productos están organizados por categorías para facilitar su búsqueda.

### ❓ 3. ¿Cómo puedo agregar productos al carrito de compras?
El usuario debe ingresar al catálogo, seleccionar el producto que desea comprar y presionar el botón para agregarlo al carrito. Después, puede consultar los productos seleccionados, aumentar o disminuir las cantidades, eliminar artículos y revisar el total de la compra.

### ❓ 4. ¿Cómo se calcula el total de mi compra?
El sistema suma los precios de los productos seleccionados para obtener el subtotal. Después, calcula el 13 % de IVA y lo agrega al subtotal para mostrar el total de la compra.

### ❓ 5. ¿Cómo puedo registrarme y realizar una compra en Catálogo Pro?
El usuario debe crear una cuenta ingresando sus datos, iniciar sesión y explorar el catálogo. Luego, selecciona los productos que desea, los agrega al carrito, revisa el subtotal, el IVA y el total, y finalmente confirma la compra para visualizar el resultado de la operación.

